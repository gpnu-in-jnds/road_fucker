%YAML:1.0
---
# Original frame size: the camera or image must match it. Both the detection
# window below and the perspective points use this coordinate system.
input_width: 1280
input_height: 720

# Processing width only; the height follows the input aspect ratio (640 -> 360).
# Every pixel-unit threshold (edge_line_residual_px, morphology_pixels, ...) is
# measured on this processed image.
process_width: 640

# Detection window: pixel rectangle [x, y, width, height] on the original frame.
# Read the numbers straight off the preview or an --overlay export: the window is
# drawn there as a thin yellow outline. It has to reach at least 80% of the image
# height, because the road profile grows from the bottom of the window.
# default for reference
# roi: [26, 86, 1229, 612]
roi: [0, 360, 1280, 360]

# OpenCV HSV: H 0..179, S/V 0..255. Calibrate these from live video.
# The broad defaults admit grey road pixels while the adaptive road/background
# models and connected-region checks supply the additional discrimination.
road_hsv: [0, 179, 0, 70, 35, 220]
equalize_value: 0
color_distance_max: 85.0
color_background_ratio: 1.15
chroma_row_ratio: 0.20
chroma_min_contrast: 3.0
edge_min_score: 3.5
# Straight-road robust line fit; pixel distances use the 640x360 process image.
edge_line_residual_px: 8.0
edge_min_inlier_ratio: 0.48
edge_min_span_fraction: 0.28
morphology_pixels: 3
max_white_gap_width_ratio: 0.22
min_road_width_fraction: 0.08
max_road_width_fraction: 0.92
junction_min_arm_widths: 0.65
junction_vote_frames: 3
junction_vote_window: 5
lookahead_fraction: 0.55
minimum_confidence: 0.38

# Add both point sets to enable a perspective transform. Coordinates use the
# original 1280x720 image and must be ordered TL, TR, BR, BL. Example:
# perspective_src: [[430, 120], [930, 120], [1220, 700], [60, 700]]
# perspective_dst: [[400, 120], [880, 120], [880, 700], [400, 700]]
