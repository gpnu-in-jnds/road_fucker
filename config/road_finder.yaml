%YAML:1.0
---
input_width: 1280
input_height: 720
process_width: 640

# Original input-image pixels. --threads N splits the ROI into N * 6 strips.
roi: [0, 360, 1280, 360]
# One fixed range for the entire view, calibrated under the final auxiliary light.
# OpenCV HSV [Hmin,Hmax,Smin,Smax,Vmin,Vmax], inclusive endpoints.
# Each reversed pair means [first,channel_max] OR [0,last]; equal means one value.
# Channel maxima: H=179, S/V=255. H, S and V must all match.
# H in [70,179] OR [0,10]: retain low-H road patches, exclude H25..45 background.
# Both hue intervals share S/V bounds; keep these calibrated for the actual camera.
road_hsv: [70, 10, 10, 150, 40, 230]
# Used only by white-occlusion diagnostics; they do not gate steering or RoadEnd.
min_road_width_fraction: 0.06
max_road_width_fraction: 0.85
morphology_pixels: 3

# Trigger window in ORIGINAL input-image pixels; may lie outside the tracking roi.
# Initial values only: calibrate against the camera angle and stopping distance.
# RoadEnd: >=2 measured strip centroids and >=80% non-mask in this window, immediately.
road_end_roi: [400, 540, 480, 120]

# White candidates are NOT automatically occlusions or road ends.
white_s_max: 45
white_v_min: 170
occlusion_max_gap_fraction: 0.25

# Optional perspective transform, original-input pixels ordered TL, TR, BR, BL.
# perspective_src: [[430, 120], [930, 120], [1220, 700], [60, 700]]
# perspective_dst: [[400, 120], [880, 120], [880, 700], [400, 700]]
